<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LINUX DO 工具箱 · 「只看此人」离线真机自检</title>
<style>
  body { font: 13px/1.6 ui-monospace, Consolas, monospace; margin: 16px; max-width: 1100px; color: #222; }
  h1 { font-size: 15px; }
  #report { white-space: pre-wrap; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
  .ok { color: #1a7f37; } .bad { color: #c62828; }
  #mock-topic { margin-top: 18px; border-top: 1px dashed #ccc; padding-top: 12px; }
  .topic-post { border-bottom: 1px solid #eee; padding: 8px 0; }
  .topic-avatar { float: left; margin-right: 10px; }
  .post-avatar, .topic-avatar img { width: 40px; height: 40px; display: block; background: #eee; border-radius: 50%; }
  .topic-meta-data { display: flex; align-items: center; gap: 8px; }
  .post-infos { margin-left: auto; color: #888; }
  .ldkit-onlyuser { border: 1px solid #999; border-radius: 10px; padding: 0 6px; font-size: 11px; text-decoration: none; color: #444; }
</style>
</head>
<body>
<h1>LINUX DO 工具箱 · 「只看此人」离线自检（真 Chromium）</h1>
<pre id="report">running…</pre>

<div id="mock-topic" class="topic-stream">
  <div class="topic-post clearfix" data-post-number="1">
    <article id="post_1" data-post-number="1">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/op_owner" data-user-card="op_owner"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">op_owner</span></div>
          <div class="post-infos"><span class="relative-date">10月9日</span></div>
        </div>
        <div class="cooked">楼主帖正文。</div>
      </div>
    </article>
  </div>
  <div class="topic-post clearfix" data-post-number="2">
    <article id="post_2" data-post-number="2">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/alice" data-user-card="alice"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">alice</span></div>
          <div class="post-infos"><span class="relative-date">9 分钟</span></div>
        </div>
        <div class="cooked">alice 的第一帖。</div>
      </div>
    </article>
  </div>
  <div class="topic-post clearfix" data-post-number="3">
    <article id="post_3" data-post-number="3">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/bob" data-user-card="bob"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">bob</span></div>
          <div class="post-infos"><span class="relative-date">7 分钟</span></div>
        </div>
        <div class="cooked">bob 的话。</div>
      </div>
    </article>
  </div>
  <div class="topic-post clearfix" data-post-number="4">
    <article id="post_4" data-post-number="4">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/alice" data-user-card="alice"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">alice</span></div>
          <div class="post-infos"><span class="relative-date">5 分钟</span></div>
        </div>
        <div class="cooked">alice 的第二帖。</div>
      </div>
    </article>
  </div>
  <!-- 本话题里只发过 1 帖的用户：官方「话题中的 X 个帖子」入口在他身上根本不出现 -->
  <div class="topic-post clearfix" data-post-number="5">
    <article id="post_5" data-post-number="5">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/solo_user" data-user-card="solo_user"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">solo_user</span></div>
          <div class="post-infos"><span class="relative-date">3 分钟</span></div>
        </div>
        <div class="cooked">只发过这一条。</div>
      </div>
    </article>
  </div>
</div>

<script>
(function () {
  'use strict';
  var R = [];
  function ok(name, cond, detail) { R.push({ name: name, ok: !!cond, detail: detail == null ? '' : String(detail) }); }
  function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function postBy(user) {
    var list = all('.topic-post');
    for (var i = 0; i < list.length; i++) {
      var a = list[i].querySelector('[data-user-card]');
      if (a && a.getAttribute('data-user-card') === user) return list[i];
    }
    return null;
  }
  function btnOf(user) { var p = postBy(user); return p ? p.querySelector('.ldkit-onlyuser') : null; }
  function nav() { return window.__NAV__ && window.__NAV__[window.__NAV__.length - 1]; }
  function navUrl() { try { return new URL(nav(), location.origin); } catch (e) { return null; } }

  function finish() {
    var pass = R.filter(function (x) { return x.ok; }).length;
    var lines = R.map(function (x) { return (x.ok ? 'PASS  ' : 'FAIL  ') + x.name + (x.detail ? ('   << ' + x.detail) : ''); });
    lines.unshift('==== 「只看此人」自检：' + pass + '/' + R.length + ' 项通过 ====');
    document.getElementById('report').textContent = lines.join('\n');
    window.__SELFCHECK_RESULTS__ = R;
    window.__SELFCHECK_DONE__ = true;
  }

  // ---- 运行模式：scenario=off 时不改写本地开关（由外部预置 onlyUser=false 来验「关掉就不插」）----
  var params = new URLSearchParams(location.search);
  var scenarioOff = params.get('scenario') === 'off';

  // ---- 只跑到「只看此人」：其余六个功能全部关掉，避免自检页面发无谓请求 ----
  if (!scenarioOff) {
    try {
      localStorage.setItem('ldkit.flags.v1', JSON.stringify({
        b64: false, mdCopy: false, linkUnlock: false, autoReact: false, readBoost: false, cfShield: false, onlyUser: true
      }));
      localStorage.removeItem('ldkit.params.v1');
    } catch (e) { /* ignore */ }
  }

  // ---- 拦截站内路由：点击按钮时记录目标 URL，不做真实跳转（真机上是 SPA 平滑切换）----
  window.__NAV__ = [];
  window.require = function (m) {
    if (m === 'discourse/lib/url') {
      return { default: { routeTo: function (url) { window.__NAV__.push(url); } } };
    }
    return undefined;
  };

  function inject() {
    return fetch('/linuxdo-toolbox.user.js', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (src) {
        var s = document.createElement('script');
        s.textContent = src;
        document.body.appendChild(s);
      });
  }

  inject().then(function () {
    return sleep(120);
  }).then(async function () {
    if (scenarioOff) {
      // ② 开关关闭：一个按钮都不该插
      await sleep(400);
      ok('⑥c 开关关闭（onlyUser=false）时不插入任何按钮', all('.ldkit-onlyuser').length === 0,
        'buttons=' + all('.ldkit-onlyuser').length);
      finish();
      return;
    }

    var posts = all('.topic-post');
    var K = window.__LDB64__ && window.__LDB64__.readBoost;

    // ① 每层楼都有按钮，且落在用户名行之后、时间行之前
    ok('① 每层楼都长出「只看此人」按钮', posts.length === 5 && posts.every(function (p) { return !!p.querySelector('.ldkit-onlyuser'); }),
      'topic-post=' + posts.length + ' buttons=' + all('.ldkit-onlyuser').length);
    ok('①b 按钮位于 .names 之后、.post-infos 之前（与官方入口同一视觉位置）', posts.every(function (p) {
      var md = p.querySelector('.topic-meta-data');
      if (!md) return false;
      var kids = Array.prototype.slice.call(md.children);
      var iB = kids.findIndex(function (k) { return k.classList.contains('ldkit-onlyuser'); });
      var iN = kids.findIndex(function (k) { return k.classList.contains('names'); });
      var iI = kids.findIndex(function (k) { return k.classList.contains('post-infos'); });
      return iB > iN && (iI === -1 || iB < iI);
    }));

    // ⑤ 单帖用户照样有按钮（官方 enoughPostsForFiltering: topicPostCount >= 2 的缺口）
    ok('⑤ 本话题只发过 1 帖的 solo_user 也有按钮（官方入口在他身上不出现）', !!btnOf('solo_user'));

    // ③ 点击生成 URL：路径正确 + 带上 username_filters + 保留既有 query（page=2）
    window.__NAV__.length = 0;
    var ba = btnOf('alice');
    if (ba) ba.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    var u = navUrl();
    ok('③ 点击 alice 的按钮 → /t/<slug>/<id> + username_filters=alice 且保留 page',
      !!u && u.pathname === '/t/xxx/2998304' && u.searchParams.get('username_filters') === 'alice' && u.searchParams.get('page') === '2',
      nav());

    // ③b 纯函数出口（供外部断言 URL 构造）
    ok('③b KitUI.buildOnlyUserUrl 纯函数可用', !!K && typeof K.buildOnlyUserUrl === 'function'
      && K.buildOnlyUserUrl('bob', true) === '/t/xxx/2998304?page=2&username_filters=bob'
      && K.buildOnlyUserUrl(null, false) === '/t/xxx/2998304?page=2',
      K && typeof K.buildOnlyUserUrl === 'function' ? (K.buildOnlyUserUrl('bob', true) + ' | ' + K.buildOnlyUserUrl(null, false)) : 'n/a');

    // ② 新楼层即时补按钮、旧楼层不重复插入
    var before = all('.ldkit-onlyuser').length;
    var extra = document.createElement('div');
    extra.className = 'topic-post clearfix';
    extra.setAttribute('data-post-number', '6');
    extra.innerHTML = '<article id="post_6" data-post-number="6">' +
      '<div class="topic-avatar"><div class="post-avatar"><a href="/u/carol" data-user-card="carol"><img alt=""></a></div></div>' +
      '<div class="topic-body"><div class="topic-meta-data">' +
      '<div class="names trigger-user-card"><span class="username">carol</span></div>' +
      '<div class="post-infos"><span class="relative-date">刚刚</span></div>' +
      '</div><div class="cooked">新来的。</div></div></article>';
    document.getElementById('mock-topic').appendChild(extra);
    await sleep(200);
    ok('② 新增楼层被即时补上按钮', all('.ldkit-onlyuser').length === before + 1,
      before + ' -> ' + all('.ldkit-onlyuser').length);
    ok('②b 同一层不会被重复插入按钮', all('.topic-post').every(function (p) { return p.querySelectorAll('.ldkit-onlyuser').length <= 1; }));

    // ④ 已筛选态：按钮变「显示全部」，点它去掉 username_filters
    history.pushState({}, '', '/t/xxx/2998304?username_filters=alice');
    await sleep(1900);
    var b2 = btnOf('alice');
    ok('④ 已筛选时该用户的按钮变为高亮的「显示全部」', !!b2 && b2.classList.contains('on') && /显示全部/.test(b2.textContent));
    window.__NAV__.length = 0;
    if (b2) b2.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    var u2 = navUrl();
    ok('④b 点击后去掉 username_filters（还原为看全部楼层）', !!u2 && u2.searchParams.get('username_filters') === null, nav());

    // ④c 子看板上的「显示全部」按钮（面板 → KitUI.ouClear）
    var cleared = K && typeof K.ouClear === 'function' ? K.ouClear() : null;
    var u3 = navUrl();
    ok('④c 面板「显示全部」经 KitUI.ouClear 去掉筛选', !!u3 && u3.searchParams.get('username_filters') === null, nav());

    // ⑥ 非话题页不插按钮；回到话题页恢复
    history.pushState({}, '', '/latest');
    await sleep(1900);
    ok('⑥ 离开话题页（/latest）后按钮全部清除', all('.ldkit-onlyuser').length === 0, 'buttons=' + all('.ldkit-onlyuser').length);
    history.pushState({}, '', '/t/xxx/2998304?page=2');
    await sleep(1900);
    ok('⑥b 回到话题页后按钮恢复', all('.ldkit-onlyuser').length > 0, 'buttons=' + all('.ldkit-onlyuser').length);

    // ⑦ 三个参数生效（位置 / 文字 / 悬停）
    K.paramHooks.onlyUser({ anchor: 'avatar', showText: true, hoverOnly: true });
    await sleep(200);
    var pb = postBy('bob');
    var bb = pb ? pb.querySelector('.ldkit-onlyuser') : null;
    ok('⑦ anchor=avatar：按钮移到头像下方', !!pb && !!pb.querySelector('.topic-avatar .post-avatar > .ldkit-onlyuser'));
    ok('⑦b showText=true：显示「只看此人」字样', !!bb && /只看此人/.test(bb.textContent) && !/display:\s*none/.test(bb.querySelector('.ou-txt').getAttribute('style') || ''));
    ok('⑦c hoverOnly=true：按钮带上 hover-only 类（默认隐藏、悬停显示）', !!bb && bb.classList.contains('hover-only'));

    finish();
  }).catch(function (e) {
    ok('自检脚本本身异常', false, String((e && e.message) || e));
    finish();
  });
})();
</script>
</body>
</html>

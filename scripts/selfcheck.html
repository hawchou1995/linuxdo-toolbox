<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LINUX DO 工具箱 · 离线自检（真 Chromium）</title>
<style>
  body { font: 13px/1.6 ui-monospace, Consolas, monospace; margin: 16px; max-width: 1100px; color: #222; }
  h1 { font-size: 15px; }
  #report { white-space: pre-wrap; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
  #mock-topic { margin-top: 18px; border-top: 1px dashed #ccc; padding-top: 12px; }
  .topic-post { border-bottom: 1px solid #eee; padding: 8px 0; }
  .topic-avatar { float: left; margin-right: 10px; }
  .post-avatar, .topic-avatar img { width: 40px; height: 40px; display: block; background: #eee; border-radius: 50%; }
  .topic-meta-data { display: flex; align-items: center; gap: 8px; }
  .post-infos { margin-left: auto; color: #888; }
  .ldkit-onlyuser { border: 1px solid #999; border-radius: 10px; padding: 0 6px; font-size: 11px; text-decoration: none; color: #444; }
</style>
</head>
<body>
<h1>LINUX DO 工具箱 · 离线自检（真 Chromium）</h1>
<pre id="report">running…</pre>

<div id="mock-topic" class="topic-stream">
  <div class="topic-post clearfix" data-post-number="1">
    <article id="post_1" data-post-number="1">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/op_owner" data-user-card="op_owner"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">op_owner</span></div>

        </div>
        <div class="cooked">楼主帖正文。</div>
      </div>
    </article>
  </div>
  <div class="topic-post clearfix" data-post-number="2">
    <article id="post_2" data-post-number="2">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/alice" data-user-card="alice"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">alice</span></div>
          <div class="post-infos"><span class="relative-date">9 分钟</span></div>
        </div>
        <div class="cooked">alice 的第一帖。</div>
      </div>

  </div>
  <div class="topic-post clearfix" data-post-number="3">
    <article id="post_3" data-post-number="3">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/bob" data-user-card="bob"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">bob</span></div>
          <div class="post-infos"><span class="relative-date">7 分钟</span></div>
        </div>
        <div class="cooked">bob 的话。</div>
      </div>
    </article>
  </div>
  <div class="topic-post clearfix" data-post-number="4">
    <article id="post_4" data-post-number="4">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/alice" data-user-card="alice"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">alice</span></div>
          <div class="post-infos"><span class="relative-date">5 分钟</span></div>
        </div>
        <div class="cooked">alice 的第二帖。</div>
      </div>
    </article>
  </div>
  <!-- 本话题里只发过 1 帖的用户：官方「话题中的 X 个帖子」入口在他身上根本不出现 -->
  <div class="topic-post clearfix" data-post-number="5">
    <article id="post_5" data-post-number="5">
      <div class="topic-avatar"><div class="post-avatar"><a href="/u/solo_user" data-user-card="solo_user"><img alt=""></a></div></div>
      <div class="topic-body">
        <div class="topic-meta-data">
          <div class="names trigger-user-card"><span class="username">solo_user</span></div>
          <div class="post-infos"><span class="relative-date">3 分钟</span></div>
        </div>
        <div class="cooked">只发过这一条。</div>
      </div>
    </article>
  </div>
</div>

<script>
(function () {
  'use strict';
  var R = [];
  function ok(name, cond, detail) { R.push({ name: name, ok: !!cond, detail: detail == null ? '' : String(detail) }); }
  function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function postBy(user) {
    var list = all('.topic-post');
    for (var i = 0; i < list.length; i++) {
      var a = list[i].querySelector('[data-user-card]');
      if (a && a.getAttribute('data-user-card') === user) return list[i];
    }
    return null;
  }
  function btnOf(user) { var p = postBy(user); return p ? p.querySelector('.ldkit-onlyuser') : null; }

  function finish() {
    var pass = R.filter(function (x) { return x.ok; }).length;
    var lines = R.map(function (x) { return (x.ok ? 'PASS  ' : 'FAIL  ') + x.name + (x.detail ? ('   << ' + x.detail) : ''); });
    lines.unshift('==== 「只看此人」自检：' + pass + '/' + R.length + ' 项通过 ====');
    document.getElementById('report').textContent = lines.join('\n');
    window.__SELFCHECK_RESULTS__ = R;
    window.__SELFCHECK_DONE__ = true;
  }

  // ---- 运行模式：cf-* 场景启用过盾模块，其余场景沿用只看此人自检 ----
  var params = new URLSearchParams(location.search);
  var scenarioOff = params.get('scenario') === 'off';
  var scenario = params.get('scenario') || '';
  var redirectForScenario = params.get('redirect');
  if (!scenario && redirectForScenario) {
    try { scenario = new URL(redirectForScenario, location.href).searchParams.get('scenario') || ''; } catch (e) { /* ignore */ }
  }
  var cfScenario = scenario.indexOf('cf-') === 0;

  if (cfScenario) {
    try {
      localStorage.setItem('ldkit.flags.v1', JSON.stringify({
        b64: false, mdCopy: false, linkUnlock: false, autoReact: false, readBoost: false, cfShield: true, onlyUser: false
      }));
      localStorage.removeItem('ldkit.params.v1');
      if (scenario === 'cf-invalid') sessionStorage.setItem('ldkit.cf.guard.v1', String(Date.now()));
    } catch (e) { /* ignore */ }
    if (scenario === 'cf-invalid') {
      var missingChallenge = document.createElement('div');
      missingChallenge.className = 'page-not-found';
      missingChallenge.textContent = 'mock challenge not found';
      document.body.appendChild(missingChallenge);
    }
    if (scenario === 'cf-retry' && location.pathname !== '/challenge') {
      var blockedDialog = document.createElement('div');
      blockedDialog.className = 'dialog-body';
      blockedDialog.textContent = '403 error';
      document.body.appendChild(blockedDialog);
    }
    if (scenario === 'cf-interstitial') {
      document.title = '請稍候...';
      window._cf_chl_opt = { cRay: 'offline-cf-ray', cH: 'offline-challenge', cUPMDTk: location.pathname + location.search };
      var widgetActions = window.__CF_WIDGET_ACTIONS__ = [];
      var cfFixture = document.createElement('div');
      cfFixture.id = 'cf-challenge-fixture';
      var cfVerify = document.createElement('button');
      cfVerify.type = 'button';
      cfVerify.textContent = 'Mock Cloudflare verification';
      cfFixture.appendChild(cfVerify);
      var cfResponse = document.createElement('input');
      cfResponse.type = 'hidden';
      cfResponse.name = 'cf-turnstile-response';
      cfFixture.appendChild(cfResponse);
      document.body.appendChild(cfFixture);
      ['click', 'input', 'change'].forEach(function (type) {
        document.addEventListener(type, function (event) {
          if (event.target && event.target.closest && event.target.closest('#cf-challenge-fixture')) {
            widgetActions.push(type);
          }
        }, true);
      });
      var inputValue = '';
      Object.defineProperty(cfResponse, 'value', {
        configurable: true,
        get: function () { return inputValue; },
        set: function (value) { widgetActions.push('token-write'); inputValue = String(value); }
      });
    }
  } else if (!scenarioOff) {
    try {
      localStorage.setItem('ldkit.flags.v1', JSON.stringify({
        b64: false, mdCopy: false, linkUnlock: false, autoReact: false, readBoost: false, cfShield: false, onlyUser: true
      }));
      localStorage.removeItem('ldkit.params.v1');
    } catch (e) { /* ignore */ }
  }
  // ---- 假 Discourse 上下文：container → controller:topic → model.postStream ----
  // 真机上这一串拿到的就是官方点击头像时用的那份 postStream，所以这里按同一形状 mock。
  var OU = { filterCalls: [], cancelCalls: [], refreshes: 0 };
  var mockPostStream = {
    userFilters: [],
    streamFilters: {},
    get: function (k) { return this[k]; },
    filterParticipant: function (u) { OU.filterCalls.push(u); this.userFilters = [u]; this.streamFilters = { username_filters: u }; },
    cancelFilter: function () { OU.cancelCalls.push(1); this.userFilters = []; this.streamFilters = {}; },
    refresh: function () { OU.refreshes++; }
  };
  function installDiscourseStub(withContainer) {
    window.require = function (m) {
      if (m !== 'discourse/lib/url') return undefined;
      if (!withContainer) return { default: {} };
      return {
        default: {
          container: {
            lookup: function (name) {
              if (name !== 'controller:topic') return undefined;
              return { get: function (k) { return k === 'model.postStream' ? mockPostStream : undefined; } };
            }
          }
        }
      };
    };
  }
  installDiscourseStub(true);
  window.__OU = OU;

  function inject() {
    return fetch('/linuxdo-toolbox.user.js', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (src) {
        var s = document.createElement('script');
        s.textContent = src;
        document.body.appendChild(s);
      });
  }

  inject().then(function () { return sleep(150); }).then(async function () {
    if (cfScenario) {
      var shield = window.__LDB64__ && window.__LDB64__.cloudShield;
      var target = shield && shield.cfFlowSnapshot ? shield.cfFlowSnapshot() : null;
      var targetUrl = target && target.target;
      var waitFor = async function (predicate, timeoutMs) {
        var end = Date.now() + timeoutMs;
        while (Date.now() < end) {
          if (predicate()) return true;
          await sleep(100);
        }
        return !!predicate();
      };
      var reportShield = function () { return shield ? shield._cfStatus : 'cfShield 未初始化'; };

      if (scenario === 'cf-wait') {
        await sleep(250);
        ok('CF① 挑战页显示等待状态且不操作验证控件', location.pathname === '/challenge'
          && /挑战验证进行中/.test(reportShield())
          && !!(document.getElementById('ldb64-manual-host')
            && document.getElementById('ldb64-manual-host').shadowRoot
            && document.getElementById('ldb64-manual-host').shadowRoot.querySelector('.cf-status')),
          location.pathname + ' / ' + reportShield());
        ok('CF② redirect 只接受同源目标并保留原地址', !!targetUrl && shield.cfValidateRedirect(targetUrl) === targetUrl,
          targetUrl || 'flow target missing');
        ok('CF③ 拒绝跨源 redirect', shield.cfValidateRedirect('https://evil.example/steal') === null,
          String(shield.cfValidateRedirect('https://evil.example/steal')));
        ok('CF④ 挑战页不触发自动跳转决策', !!shield.cfPlanJump(false) && shield.cfPlanJump(false).reason === 'on-challenge',
          JSON.stringify(shield.cfPlanJump(false)));
        finish();
        return;
      }

      if (scenario === 'cf-interstitial') {
        await sleep(250);
        var originalChallengeUrl = location.href;
        var interstitialFlow = shield && shield.cfFlowSnapshot ? shield.cfFlowSnapshot() : null;
        var interstitialPath = location.pathname;
        var pathCovered = interstitialPath === '/new' || interstitialPath === '/latest'
          || /^\/t\/[^/]+\/\d+/.test(interstitialPath);
        ok('CF⑫ 原 URL challenge 进入等待态并完整保留路径及查询参数',
          pathCovered && location.search.indexOf('probe=') !== -1 && !!interstitialFlow
            && interstitialFlow.target === originalChallengeUrl
            && /Cloudflare 挑战验证进行中/.test(reportShield())
            && !!document.querySelector('input[name="cf-turnstile-response"]'),
          JSON.stringify(interstitialFlow) + ' / ' + reportShield());
        ok('CF⑬ interstitial 等待时禁止再次跳盾', shield.cfPlanJump(false).reason === 'on-challenge',
          JSON.stringify(shield.cfPlanJump(false)));
        delete window._cf_chl_opt;
        var responseInput = document.querySelector('input[name="cf-turnstile-response"]');
        if (responseInput) responseInput.remove();
        document.title = 'Mock page restored';
        var readyNode = document.createElement('div');
        readyNode.id = 'mock-page-restored';
        document.body.appendChild(readyNode);
        await waitFor(function () { return /挑战验证完成，已恢复原页面/.test(reportShield()); }, 8000);
        ok('CF⑭ challenge 消失并稳定后自动确认仍在原 URL', location.href === originalChallengeUrl
          && /挑战验证完成，已恢复原页面/.test(reportShield()),
          'actual=' + location.href + ' expected=' + originalChallengeUrl + ' / ' + reportShield());
        ok('CF⑮ interstitial 恢复确认后清除 flow', shield.cfFlowSnapshot() === null,
          JSON.stringify(shield.cfFlowSnapshot()));
        ok('CF⑯ 验证等待与自动恢复期间未点击控件或写入 token',
          window.__CF_WIDGET_ACTIONS__.length === 0 && responseInput.value === ''
            && document.activeElement !== document.querySelector('#cf-challenge-fixture button'),
          JSON.stringify(window.__CF_WIDGET_ACTIONS__) + ' / token=' + responseInput.value);
        finish();
        return;
      }

      if (scenario === 'cf-invalid') {
        await sleep(250);
        ok('CF⑤ 挑战页失效时识别冷却并保持当前页', location.pathname === '/challenge'
          && /冷却中/.test(reportShield()), location.pathname + ' / ' + reportShield());
        ok('CF⑥ 冷却中的失效挑战仍保留同源原目标', !!targetUrl && shield.cfValidateRedirect(targetUrl) === targetUrl,
          targetUrl || 'flow target missing');
        finish();
        return;
      }

      if (scenario === 'cf-success' && location.pathname === '/challenge') {
        setTimeout(function () { history.replaceState({}, '', '/latest?scenario=cf-success'); }, 250);
        return;
      }
      if (scenario === 'cf-success') {
        var expectedSuccessUrl = new URL(targetUrl || location.href).href;
        await waitFor(function () { return /挑战验证完成/.test(reportShield()); }, 8000);
        ok('CF⑦ 挑战页正常返回后自动恢复原目标 URL', location.href === expectedSuccessUrl,
          'actual=' + location.href + ' expected=' + expectedSuccessUrl);
        ok('CF⑧ 恢复完成后清除本次 flow', !!shield && shield.cfFlowSnapshot() === null,
          JSON.stringify(shield && shield.cfFlowSnapshot()));
        ok('CF⑨ 恢复状态可见且无需面板点击', /挑战验证完成，已恢复原页面/.test(reportShield()), reportShield());
        finish();
        return;
      }

      if (scenario === 'cf-retry') {
        if (location.pathname === '/challenge') {
          target = shield && shield.cfFlowSnapshot ? shield.cfFlowSnapshot() : null;
          targetUrl = target && target.target;
          if (targetUrl) {
            var returnTarget = new URL(targetUrl);
            var failedReturn = document.createElement('div');
            failedReturn.className = 'dialog-body';
            failedReturn.textContent = '403 error';
            document.body.appendChild(failedReturn);
            history.replaceState({}, '', returnTarget.pathname + returnTarget.search + returnTarget.hash);
          }
        }
        await waitFor(function () { return /自动重试已达上限/.test(reportShield()); }, 15000);
        target = shield && shield.cfFlowSnapshot ? shield.cfFlowSnapshot() : null;
        ok('CF⑩ 站点拦截错误进入有上限的自动重试', !!target && target.phase === 'exhausted'
          && target.attempts === 2 && /自动重试已达上限/.test(reportShield()),
          JSON.stringify(target) + ' / ' + reportShield());
        ok('CF⑪ 达到上限后停留在原目标，不再循环导航', location.pathname === '/t/xxx/2998304'
          && new URL(location.href).searchParams.get('scenario') === 'cf-retry', location.href);
        finish();
        return;
      }
    }

    if (scenarioOff) {
      await sleep(500);
      ok('⑨ 开关关闭（onlyUser=false）时不插入任何按钮', all('.ldkit-onlyuser').length === 0,
        'buttons=' + all('.ldkit-onlyuser').length);
      finish();
      return;
    }

    var posts = all('.topic-post');
    var K = window.__LDB64__ && window.__LDB64__.readBoost;

    // Base codec 与自动识别回归（共用真实脚本调试出口）
    var LD = window.__LDB64__;
    var codecs = LD && LD.baseCodecs;
    var decodeBytesText = function (format, input) {
      if (!codecs) return null;
      var decoded = codecs.decodeBytes(format, input);
      if (decoded == null) return null;
      try { return new TextDecoder('utf-8', { fatal: true }).decode(decoded); } catch (e) { return null; }
    };
    var utf8Fixture = function (text) { return new TextEncoder().encode(text); };
    ok('Base codec 调试出口存在', !!codecs && typeof codecs.decodeBytes === 'function' && typeof codecs.encodeBytes === 'function');
    ok('Base16 Hello 固定向量', decodeBytesText('base16', '48656C6C6F') === 'Hello');
    ok('Base32 Hello 固定向量', decodeBytesText('base32', 'JBSWY3DP') === 'Hello');
    ok('Base64 Hello 固定向量', decodeBytesText('base64', 'SGVsbG8=') === 'Hello');
    ok('Base58 保留两个前导零字节', !!codecs && codecs.encodeBytes('base58', Uint8Array.of(0, 0)) === '11'
      && Array.from(codecs.decodeBytes('base58', '11') || []).join(',') === '0,0');
    ok('Base58 文本字节往返', !!codecs && decodeBytesText('base58', codecs.encodeBytes('base58', utf8Fixture('Base58 fixture'))) === 'Base58 fixture');
    ok('Base58 拒绝非法字母', !!codecs && codecs.decodeBytes('base58', '0OIl') === null);
    ok('Base16 拒绝奇数位载荷', !!codecs && codecs.decodeBytes('base16', 'ABC') === null);
    ok('Base64URL 无 padding 往返', !!codecs && codecs.encodeBytes('base64url', Uint8Array.of(251, 255)) === '-_8'
      && Array.from(codecs.decodeBytes('base64url', '-_8') || []).join(',') === '251,255');
    ok('Base64/Base64URL 相同文本候选合并并保留旧自动解码', !!LD && typeof LD.detectBaseCandidates === 'function'
      && LD.detectBaseCandidates('SGVsbG8=', { format: 'auto', allowLossy: false, minDecoded: 1 }).length === 1
      && LD.detectBaseCandidates('SGVsbG8=', { format: 'auto', allowLossy: false, minDecoded: 1 })[0].format === 'base64'
      && LD.resolveText('SGVsbG8gd29ybGQ=') === 'Hello world');
    var oldAutoMinLen = LD.CFG.minLen;
    LD.CFG.minLen = 17;
    var minLenPreserved = LD.resolveText('SGVsbG8gd29ybGQ=') === null && LD.decodeOnce('SGVsbG8gd29ybGQ=') === null;
    LD.CFG.minLen = oldAutoMinLen;
    ok('自动解码与兼容 decodeOnce 保留 CFG.minLen 门槛', minLenPreserved);
    var urlSafeReadable = codecs ? codecs.encodeBytes('base64url', utf8Fixture('你好，LINUX DO 🎉')) : '';
    ok('Base64URL 专用字符触发 Base64URL 识别', !!LD && typeof LD.detectBaseCandidates === 'function'
      && /[-_]/.test(urlSafeReadable)
      && LD.detectBaseCandidates(urlSafeReadable, { format: 'auto', allowLossy: false, minDecoded: 1 }).some(function (c) { return c.format === 'base64url' && c.text === '你好，LINUX DO 🎉'; }));
    if (LD && LD.CFG) {
      var savedMinLen = LD.CFG.minLen, savedMinDecoded = LD.CFG.minDecoded;
      LD.CFG.minLen = 1; LD.CFG.minDecoded = 1;
      var ambiguityCandidates = typeof LD.detectBaseCandidates === 'function'
        ? LD.detectBaseCandidates('3456265A2645', { format: 'auto', allowLossy: false, minDecoded: 1 }) : [];
      ok('不同结果的 Base16/Base64 碰撞保留为歧义', ambiguityCandidates.length >= 2 && LD.resolveText('3456265A2645') === null,
        'candidates=' + ambiguityCandidates.length);
      var mixedPlain = 'Mixed Base layers fixture';
      var mixedInner = codecs.encodeBytes('base58', utf8Fixture(mixedPlain));
      var mixedOuter = codecs.encodeBytes('base64', utf8Fixture(mixedInner));
      var mixedResult = LD.decodeManualInput(mixedOuter, 'auto');
      ok('混合 Base64→Base58 多层解码恢复原文', !!mixedResult.ok && mixedResult.segments.length === 1
        && mixedResult.segments[0].text === mixedPlain && mixedResult.segments[0].rounds === 2,
        mixedResult.ok ? mixedResult.segments[0].label : mixedResult.reason);
      ok('帖子自动多轮 resolver 逐层识别混合格式', LD.resolveText(mixedOuter) === mixedPlain);
      var manualCollision = LD.decodeManualInput('3456265A26452409', 'auto');
      ok('手动 Auto 将不同结果歧义展开为可选候选', !!manualCollision.ok && manualCollision.ambiguous === true
        && manualCollision.segments.length > 1 && manualCollision.segments.some(function (s) { return s.format === 'base16'; })
        && manualCollision.segments.some(function (s) { return s.format === 'base64'; }),
        manualCollision.ok ? manualCollision.segments.map(function (s) { return s.label; }).join(' | ') : manualCollision.reason);
    var scanPlain = 'Base58 unique scan fixture';
    var scanToken = codecs ? codecs.encodeBytes('base58', utf8Fixture(scanPlain)) : '';
    var scanCandidates = LD && typeof LD.detectBaseCandidates === 'function'
      ? LD.detectBaseCandidates(scanToken, { format: 'auto', allowLossy: false, minDecoded: 5 }) : [];
    var savedScanMinLen = LD.CFG.minLen, savedScanMinDecoded = LD.CFG.minDecoded;
    LD.CFG.minLen = 16; LD.CFG.minDecoded = 5;
    var scanRoot = document.createElement('div');
    scanRoot.className = 'cooked';
    scanRoot.textContent = scanToken;
    LD.processCooked(scanRoot);
    ok('帖子正文唯一 Base58 候选自动解码', scanCandidates.length === 1 && scanCandidates[0].format === 'base58'
      && !!scanRoot.querySelector('.ld-b64') && scanRoot.querySelector('.ld-b64').dataset.decoded === scanPlain);
    var collisionScanToken = '3456265A26452409';
    var collisionRoot = document.createElement('div');
    collisionRoot.className = 'cooked';
    collisionRoot.textContent = collisionScanToken;
    LD.processCooked(collisionRoot);
    ok('帖子正文不同结果歧义保持原文', LD.detectBaseCandidates(collisionScanToken, { format: 'auto', allowLossy: false, minDecoded: 5 }).length > 1
      && collisionRoot.textContent === collisionScanToken && !collisionRoot.querySelector('.ld-b64'));
    LD.CFG.minLen = savedScanMinLen; LD.CFG.minDecoded = savedScanMinDecoded;
      LD.CFG.minLen = savedMinLen; LD.CFG.minDecoded = savedMinDecoded;
    } else ok('不同结果的 Base16/Base64 碰撞保留为歧义', false, 'CFG export missing');
    // ① 位置
    ok('① 每层楼都长出「只看此人」按钮', posts.length === 5 && posts.every(function (p) { return !!p.querySelector('.ldkit-onlyuser'); }),
      'topic-post=' + posts.length + ' buttons=' + all('.ldkit-onlyuser').length);
    ok('①b 按钮位于 .names 之后、.post-infos 之前', posts.every(function (p) {
      var md = p.querySelector('.topic-meta-data');
      if (!md) return false;
      var kids = Array.prototype.slice.call(md.children);
      var iB = kids.findIndex(function (k) { return k.classList.contains('ldkit-onlyuser'); });
      var iN = kids.findIndex(function (k) { return k.classList.contains('names'); });
      var iI = kids.findIndex(function (k) { return k.classList.contains('post-infos'); });
      return iB > iN && (iI === -1 || iB < iI);
    }));

    // ② 单帖用户（官方入口的缺口）
    ok('② 本话题只发过 1 帖的 solo_user 也有按钮', !!btnOf('solo_user'));

    // ③ 点击 → 调官方 filterParticipant（SPA），不整页跳
    OU.filterCalls.length = 0;
    var ba = btnOf('alice');
    if (ba) ba.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    ok('③ 点击「只看此人」→ 调官方的 postStream.filterParticipant(用户名)', OU.filterCalls.length === 1 && OU.filterCalls[0] === 'alice',
      JSON.stringify(OU.filterCalls));
    ok('③b 走 SPA（没有整页跳转），且出口记录 mode=spa',
      !!(K && K.ouLastAction && K.ouLastAction.mode === 'spa' && K.ouLastAction.user === 'alice'),
      K && K.ouLastAction ? JSON.stringify(K.ouLastAction) : 'n/a');

    // ④ 退化路径的判据（只读决策出口，不真跳）
    ok('④ KitUI.ouPlan：有官方上下文 → spa', !!(K && K.ouPlan && K.ouPlan('bob').mode === 'spa'),
      K && K.ouPlan ? JSON.stringify(K.ouPlan('bob')) : 'n/a');
    installDiscourseStub(false);
    var plan = K && K.ouPlan ? K.ouPlan('bob') : null;
    ok('④b KitUI.ouPlan：拿不到容器 → 退化为整页跳且 URL 正确',
      !!plan && plan.mode === 'load' && plan.url === '/t/xxx/2998304?page=2&username_filters=bob',
      plan ? JSON.stringify(plan) : 'n/a');
    installDiscourseStub(true);

    // ④c URL 纯函数出口
    ok('④c KitUI.buildOnlyUserUrl 纯函数可用', !!K && typeof K.buildOnlyUserUrl === 'function'
      && K.buildOnlyUserUrl('bob', true) === '/t/xxx/2998304?page=2&username_filters=bob'
      && K.buildOnlyUserUrl(null, false) === '/t/xxx/2998304?page=2',
      K && typeof K.buildOnlyUserUrl === 'function' ? (K.buildOnlyUserUrl('bob', true) + ' | ' + K.buildOnlyUserUrl(null, false)) : 'n/a');

    // ⑤ 新楼层即时补按钮、不重复
    var before = all('.ldkit-onlyuser').length;
    var extra = document.createElement('div');
    extra.className = 'topic-post clearfix';
    extra.setAttribute('data-post-number', '6');
    extra.innerHTML = '<article id="post_6" data-post-number="6">' +
      '<div class="topic-avatar"><div class="post-avatar"><a href="/u/carol" data-user-card="carol"><img alt=""></a></div></div>' +
      '<div class="topic-body"><div class="topic-meta-data">' +
      '<div class="names trigger-user-card"><span class="username">carol</span></div>' +
      '<div class="post-infos"><span class="relative-date">刚刚</span></div>' +
      '</div><div class="cooked">新来的。</div></div></article>';
    document.getElementById('mock-topic').appendChild(extra);
    await sleep(250);
    ok('⑤ 新增楼层被即时补上按钮', all('.ldkit-onlyuser').length === before + 1, before + ' -> ' + all('.ldkit-onlyuser').length);
    ok('⑤b 同一层不会被重复插入按钮', all('.topic-post').every(function (p) { return p.querySelectorAll('.ldkit-onlyuser').length <= 1; }));

    // ⑥ 已筛选态：按钮变「显示全部」，点它调官方 cancelFilter
    history.pushState({}, '', '/t/xxx/2998304?page=2&reflow=1');   // 触发模块重排按钮（它按 href 变化重建）
    await sleep(1900);
    var b2 = btnOf('alice');
    ok('⑥ 已筛选时该用户的按钮变为高亮的「显示全部」', !!b2 && b2.classList.contains('on') && /显示全部/.test(b2.textContent),
      b2 ? (b2.className + ' / ' + b2.textContent.trim()) : 'n/a');
    OU.cancelCalls.length = 0;
    if (b2) b2.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    ok('⑥b 点「显示全部」→ 调官方的 postStream.cancelFilter()', OU.cancelCalls.length === 1 && OU.refreshes >= 1,
      'cancel=' + OU.cancelCalls.length + ' refresh=' + OU.refreshes);

    // ⑥c 子看板上的「显示全部」走同一条路
    mockPostStream.userFilters = ['bob'];              // 造一个「正在筛选」的态
    OU.cancelCalls.length = 0;
    var cleared = K && typeof K.ouClear === 'function' ? K.ouClear() : null;
    ok('⑥c 面板「显示全部」经 KitUI.ouClear → 调 cancelFilter', cleared === true && OU.cancelCalls.length === 1,
      'ret=' + cleared + ' cancel=' + OU.cancelCalls.length);

    // ⑦ 非话题页不插按钮；回到话题页恢复
    history.pushState({}, '', '/latest');
    await sleep(1900);
    ok('⑦ 离开话题页（/latest）后按钮全部清除', all('.ldkit-onlyuser').length === 0, 'buttons=' + all('.ldkit-onlyuser').length);
    history.pushState({}, '', '/t/xxx/2998304?page=2');
    await sleep(1900);
    ok('⑦b 回到话题页后按钮恢复', all('.ldkit-onlyuser').length > 0, 'buttons=' + all('.ldkit-onlyuser').length);

    // ⑧ 三个参数生效（位置 / 文字 / 悬停）
    K.paramHooks.onlyUser({ anchor: 'avatar', showText: true, hoverOnly: true });
    await sleep(250);
    var pb = postBy('bob');
    var bb = pb ? pb.querySelector('.ldkit-onlyuser') : null;
    ok('⑧ anchor=avatar：按钮移到头像下方', !!pb && !!pb.querySelector('.topic-avatar .post-avatar > .ldkit-onlyuser'));
    ok('⑧b showText=true：显示「只看此人」字样', !!bb && /只看此人/.test(bb.textContent) && !/display:\s*none/.test(bb.querySelector('.ou-txt').getAttribute('style') || ''));
    ok('⑧c hoverOnly=true：按钮带上 hover-only 类', !!bb && bb.classList.contains('hover-only'));

    // ⑨ 「密文自解」的反向能力：主动加码（明文 → Base64）—— 走真面板的 shadow DOM
    const hostEl = document.getElementById('ldb64-manual-host');
    const sh = hostEl && hostEl.shadowRoot;
    ok('⑨ 手动面板已挂载（shadow root 可取）', !!sh);
    if (sh) {
      const modeEnc = sh.querySelector('[data-act="mode-enc"]');
      const modeDec = sh.querySelector('[data-act="mode-dec"]');
      const goBtn = sh.querySelector('[data-act="decode"]');
      const taEl = sh.querySelector('.ta');
      const outEl = sh.querySelector('.out');
      const formatSelect = sh.querySelector('.format-select');
      const bodyOf = function () { const s = outEl.querySelector('.seg-body'); return s ? s.textContent : ''; };
      const tagOf = function () { const s = outEl.querySelector('.seg-tag'); return s ? s.textContent : ''; };
      const run = async function (text) {
        taEl.value = text;
        taEl.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(420);
        return bodyOf();
      };
      const chooseFormat = async function (format) {
        formatSelect.value = format;
        formatSelect.dispatchEvent(new Event('change', { bubbles: true }));
        await sleep(30);
      };

      ok('⑨a 解码方向默认格式为 Auto', !!formatSelect && formatSelect.value === 'auto', formatSelect && formatSelect.value);
      modeEnc.click();
      ok('⑨b 切到加码方向：aria-pressed、按钮文案及默认 Base64 正确',
        modeEnc.getAttribute('aria-pressed') === 'true' && modeDec.getAttribute('aria-pressed') === 'false'
          && goBtn.textContent === '加码' && formatSelect.value === 'base64',
        modeEnc.getAttribute('aria-pressed') + '/' + modeDec.getAttribute('aria-pressed') + '/' + goBtn.textContent + '/' + formatSelect.value);

      const PLAIN = '你好，LINUX DO 🎉\n第二行：https://linux.do/t/2998304';
      const FORMAT_CASES = [
        { id: 'base16', label: 'Base16', re: /^[0-9A-F\n]+$/ },
        { id: 'base32', label: 'Base32', re: /^[A-Z2-7=\n]+$/ },
        { id: 'base58', label: 'Base58', re: /^[1-9A-HJ-NP-Za-km-z\n]+$/ },
        { id: 'base64', label: 'Base64', re: /^[A-Za-z0-9+/=\n]+$/ },
        { id: 'base64url', label: 'Base64URL', re: /^[A-Za-z0-9_\-\n]+$/ }
      ];
      for (const spec of FORMAT_CASES) {
        await chooseFormat(spec.id);
        const encoded = await run(PLAIN);
        const encodedTag = tagOf();
        ok('⑨c ' + spec.label + ' 输出字母表与格式标签正确', encoded.length > 0 && spec.re.test(encoded)
          && encodedTag.indexOf(spec.label) >= 0, encodedTag + ' / ' + encoded.slice(0, 44));
        if (spec.id === 'base64url') ok('⑨c2 Base64URL Unicode 载荷使用 -/_ 且不补等号', /[-_]/.test(encoded) && !/=/.test(encoded), encoded.slice(0, 60));
        ok('⑨d ' + spec.label + ' 格式保存到 encFormat', window.__LDB64__.getParams('b64').encFormat === spec.id,
          window.__LDB64__.getParams('b64').encFormat);
        if (spec.id === 'base64url') ok('⑨e Base64URL 同步旧 encUrlSafe=true', window.__LDB64__.getParams('b64').encUrlSafe === true);
        if (spec.id === 'base64') ok('⑨f Base64 同步旧 encUrlSafe=false', window.__LDB64__.getParams('b64').encUrlSafe === false);

        modeDec.click();
        await chooseFormat(spec.id);
        const decoded = await run(encoded);
        const decodedTag = tagOf();
        ok('⑨g ' + spec.label + ' 指定格式往返保持中文/emoji/换行', decoded === PLAIN, JSON.stringify(decoded.slice(0, 60)));
        ok('⑨h ' + spec.label + ' 解码结果标题注明格式', decodedTag.indexOf(spec.label) >= 0, decodedTag);
        ok('⑨i 解码输出块保留复制按钮', !!outEl.querySelector('.seg-hd .mini'));
        modeEnc.click();
      }

      modeDec.click();
      await chooseFormat('auto');
      const collisionOutput = await run(collisionScanToken);
      const visibleCollisionTags = Array.from(outEl.querySelectorAll('.seg-tag')).map(function (el) { return el.textContent; }).join(' | ');
      ok('⑨i2 手动 Auto 将 Base16/Base64 歧义都显示为候选', outEl.querySelectorAll('.seg').length > 1
        && /Base16/.test(visibleCollisionTags) && /Base64/.test(visibleCollisionTags), visibleCollisionTags || collisionOutput);
      modeEnc.click();
      const beforeLegacy = localStorage.getItem('ldkit.params.v1');
      localStorage.setItem('ldkit.params.v1', JSON.stringify({ b64: { encUrlSafe: true } }));
      const legacyUrlFormat = window.__LDB64__.loadParams().b64.encFormat;
      localStorage.setItem('ldkit.params.v1', JSON.stringify({ b64: { encUrlSafe: false } }));
      const legacyStdFormat = window.__LDB64__.loadParams().b64.encFormat;
      if (beforeLegacy === null) localStorage.removeItem('ldkit.params.v1');
      else localStorage.setItem('ldkit.params.v1', beforeLegacy);
      ok('⑨j 旧参数 encUrlSafe=true 迁移为 Base64URL', legacyUrlFormat === 'base64url', legacyUrlFormat);
      ok('⑨k 旧参数 encUrlSafe=false 迁移为 Base64', legacyStdFormat === 'base64', legacyStdFormat);

      window.__LDB64__.saveParams('b64', { encFormat: 'base64url', encUrlSafe: true, encWrap: 8, encRounds: 2 });
      const enc2 = await run('你好，LINUX DO 🎉');
      const tag2 = tagOf();
      ok('⑨l 两层 Base64URL 只用 URL-safe 字母表', !/[+/=]/.test(enc2), enc2.slice(0, 64));
      ok('⑨m 按行折行：每行不超过 8 字符且确有换行',
        enc2.indexOf('\n') >= 0 && enc2.split('\n').every(function (line) { return line.length <= 8; }), JSON.stringify(enc2));
      ok('⑨n 两层编码标签标出 Base64URL 与层数', /Base64URL/.test(tag2) && /连续加码 2 层/.test(tag2), tag2);
      modeDec.click();
      await chooseFormat('base64url');
      const dec2 = await run(enc2.replace(/\s+/g, ''));
      ok('⑨o 两层 Base64URL 解码往返保持原文', dec2 === '你好，LINUX DO 🎉', JSON.stringify(dec2));

      window.__LDB64__.resetParams('b64');
      ok('⑨p 参数重置恢复 Base64', window.__LDB64__.getParams('b64').encFormat === 'base64', window.__LDB64__.getParams('b64').encFormat);
      modeEnc.click();
      ok('⑨q 重置后加码方向选择器回显 Base64', formatSelect.value === 'base64', formatSelect.value);
    }

    finish();
  }).catch(function (e) {
    ok('自检脚本本身异常', false, String((e && e.message) || e));
    finish();
  });
})();
</script>
</body>
</html>
